name: AI Secretary Tick

# Pings the AI Secretary's Make.com webhook on a schedule so it can check for
# low stock, overdue orders/samples, and due reminders, and notify via Telegram.
# The interval is deliberately spaced out to stay within Make's free-plan
# operations budget (1000 ops/month, shared with other scenarios on the account).
# Increase the frequency only if you've upgraded the Make plan or are watching
# usage under Make > Organization > Billing.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call AI Secretary webhook
        env:
          WEBHOOK_URL: ${{ secrets.AI_SECRETARY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "AI_SECRETARY_WEBHOOK_URL secret is not set yet — skipping."
            exit 0
          fi
          curl -sS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"kind":"tick"}'
