name: CORS Debug (temporary)
on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: OPTIONS preflight check
        run: |
          echo "=== OPTIONS preflight ==="
          curl -sS -i -X OPTIONS "https://hook.eu1.make.com/m9bnpoy9pomx5l87uv2g8kkgkze78858" \
            -H "Origin: https://inventory-app.vercel.app" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type"
      - name: POST with Origin header
        run: |
          echo "=== POST with Origin ==="
          curl -sS -i -X POST "https://hook.eu1.make.com/m9bnpoy9pomx5l87uv2g8kkgkze78858" \
            -H "Origin: https://inventory-app.vercel.app" \
            -H "Content-Type: application/json" \
            -d '{"kind":"chat","user":"Debug","text":"ping"}'
